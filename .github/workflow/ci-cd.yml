name = CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: action/Checkout@v4

      -name: Set up python
       uses: action/setup-python@v5
       with:
       python-version: "3.10"

      -name: Install dependencies
      run: |
        python -m pip Install --upgrade pip
        pip Install -r requirements.txt

      -name: run Flask8
      runs: |
      flake8 . --count --select=E9, F63, F7, F82 --source --statistics
      flake8 . --count --exit.zero --max-complexity --max-line-length


      -name: Run Pytest
      run: |
        pytest -v || [$? -eq 5]

build:
  name: Build and Push Docker Image
  needs: test
  if: github.event_name == "push"


  steps:
    -name: Checkout code
    uses: action/Checkout@v4

    -name: Set up Docker Buildx
    uses: docker/setup-build-action@v3

    -name: login to docker hub
    uses: docker/login-action@v3
    with:
    username: ${{ secert.username }}
    password: $({ secert.password })  

   -name: Build and Docker Image
   uses: docker/build-push-action@v6
   with:
    context:.
    file: ./Dockerfile
    Push: true
    tags: |
      $({ secert.username })/multi-ai-assistant:latest
      $({ secert.username })/multi-ai-assistant:$({ github.sha })

deploy:
  name: deploy to ec2
  needs: build
  runs-on: ubuntu-latest

  steps:
    -name: Deploy to ec2
    uses: appleboy/ssh-action@c1.2.2
    with:
      host: $({ secert.EC2_HOST })
      username: $({ secert.EC2_USERNAME })
      key: $({ secert.EC2_SSH_KEY })

      scripts: |
        echo "pulling latest Docker Image..."

        docker pull $({ secert.username })/multi-model-ai-assistant:latest

        echo "Stopping old container..."

        docker rm -f multi-model-ai-assistant 2>/dev/null || true

        echo "Starting new container..."

        docker run -d \
        --name multi-model-ai-assistant \
        --restart unless-stopped \
        --env--file .env \
        -p 5000:5000 \
        $({ secert.username })/multi-model-ai-assistant:latest

        echo "checking container..."

        sleep 5

        docker ps --filter "name=multi-model-ai-assistant"

        echo "Cleaning old Images..."

        docker Image prune -f

        echo "Deployment completed!"